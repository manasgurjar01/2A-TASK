<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Table</title>
  </head>

  <body>
    <input type="text" id="input-name" placeholder="Enter Name" />
    <input type="number" id="input-age" placeholder="Enter Age" />

    <button id="btn">Add Data</button>

    <h1>Data Info</h1>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="table-body"></tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
