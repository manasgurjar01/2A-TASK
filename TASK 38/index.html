<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>
<body>

    <h1 id="he">Loading....</h1>
    
    <script>
        let h1 = document.querySelector('#he');

        setTimeout(() => {
            let body = document.body;
            body.style.backgroundColor = 'black';
            body.style.color = 'white';
            h1.innerHTML = 'Page Load Successfully.....'
        }, 2000);
    </script>

</body>
</html>
