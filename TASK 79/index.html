<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>model UI</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Product UI</h1>

    <div class="products">
      <div class="card">
        <img src="card1.jpg" alt="Mobile" />
        <h3>Mobile</h3>
        <p class="price">&#8377;50,000</p>
        <button class="btn">Add to Cart</button>
      </div>

      <div class="card">
        <img src="card2.jpg" alt="Laptop" />
        <h3>Laptop</h3>
        <p class="price">&#8377;60,000</p>
        <button class="btn">Add to Cart</button>
      </div>

      <div class="card">
        <img src="card3.jpg" alt="Headphone" />
        <h3>Headphone</h3>
        <p class="price">&#8377;3,999</p>
        <button class="btn">Add to Cart</button>
      </div>

      <div class="card">
        <img src="card4.jpg" alt="Mouse" />
        <h3>Mouse</h3>
        <p class="price">&#8377;999</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>

   

    <div class="modal" id="modal">
      <div class="modal-content" id="modalContent">
        <button class="close" id="close">X</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
