<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js dropdown</title>
    <style>
      .select {
        border: 1px solid black;
        width: 60px;
        cursor: pointer;
      }
      

      .city {
        display: none;
        padding: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Select your city</h1>

    <div class="dropdown">
      <div class="select">Select<span>▼</span></div>
      <div class="city">Indore</div>
      <div class="city">Dewas</div>
      <div class="city">Bhopal</div>
      <div class="city">Ujjain</div>
      <div class="city">Ratlam</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
