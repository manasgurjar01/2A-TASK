<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Character Counter</title>
  </head>

  <body>
    <textarea id="input-box" rows="4" cols="30"></textarea>

    <br />

    <button id="btn">Count</button>

    <h3 id="words">Words : 0</h3>
    <h3 id="characters">Characters : 0</h3>

    <script>
      let btn = document.querySelector("#btn");
      let words = document.querySelector("#words");
      let characters = document.querySelector("#characters");

      btn.addEventListener("click", () => {
        let input = document.querySelector("#input-box").value;

        let charCount = input.length;

        let wordCount = input.trim().split(" ").length;

        characters.innerHTML = `Characters : ${charCount}`;

        words.innerHTML = `Words : ${wordCount}`;
      });
    </script>
  </body>
</html>
