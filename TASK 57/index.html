<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Tab Buttons -->

    <div class="tabs">
      <button class="tab" data-tab="html">HTML</button>

      <button class="tab" data-tab="css">CSS</button>

      <button class="tab" data-tab="js">JavaScript</button>
    </div>

    <!-- Tab Content -->

    <div id="html" class="content active">
      <h2>HTML</h2>
      <p>HTML creates webpage structure.</p>
    </div>

    <div id="css" class="content">
      <h2>CSS</h2>
      <p>CSS designs the webpage.</p>
    </div>

    <div id="js" class="content">
      <h2>JavaScript</h2>
      <p>JavaScript makes the webpage interactive.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
