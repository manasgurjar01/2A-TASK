<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Filtering</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Product App</h1>

    <!-- Category Filter -->

    <div class="filter">
      <label>Filter by Category:</label>

      <select id="category">
        <option value="all">All</option>

        <option value="electronics">Electronics</option>

        <option value="accessories">Accessories</option>
      </select>
    </div>

    <!-- Products -->

    <div class="products">
      <div class="card" data-category="electronics">
        <img src="card1.jpg" alt="Mobile" />

        <h3>Mobile</h3>

        <p class="price">₹50,000</p>

        <p>⭐ 4.5</p>
      </div>

      <div class="card" data-category="electronics">
        <img src="card2.jpg" alt="Laptop" />

        <h3>Laptop</h3>

        <p class="price">₹60,000</p>

        <p>⭐ 4.7</p>
      </div>

      <div class="card" data-category="accessories">
        <img src="card3.jpg" alt="Headphone" />

        <h3>Headphone</h3>

        <p class="price">₹3,999</p>

        <p>⭐ 4.3</p>
      </div>

      <div class="card" data-category="accessories">
        <img src="card4.jpg" alt="Mouse" />

        <h3>Mouse</h3>

        <p class="price">₹999</p>

        <p>⭐ 4.2</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
