<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom manipulation</title>

    <style>
      .main {
        display: none;
      }

    <button id="open">Open</button>

    <div class="main">

      <p>Welcome to Java Script</p>

    </div>

    <script src="script.js"></script>
