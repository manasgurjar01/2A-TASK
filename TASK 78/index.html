<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product sorting</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Product App</h1>

    <div class="sort">
      <label>Sort by Price:</label>
      <select id="sort">
        <option value="default">Default</option>
        <option value="low">Low to High</option>
        <option value="high">High to Low</option>
      </select>
    </div>

    <div class="products" id="products">
      <div class="card">
        <img src="card1.jpg" alt="Mobile" />
        <h3>Mobile</h3>
        <p class="price">50000</p>
        <p>⭐ 4.5</p>
      </div>

      <div class="card">
        <img src="card2.jpg" alt="Laptop" />
        <h3>Laptop</h3>
        <p class="price">60000</p>
        <p>⭐ 4.7</p>
      </div>

      <div class="card">
        <img src="card3.jpg" alt="Headphone" />
        <h3>Headphone</h3>
        <p class="price">3999</p>
        <p>⭐ 4.3</p>
      </div>

      <div class="card">
        <img src="card4.jpg" alt="Mouse" />
        <h3>Mouse</h3>
        <p class="price">999</p>
        <p>⭐ 4.2</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
